      <stop stop-color="#071426"/>
      <stop offset="0.5" stop-color="#10183A"/>
      <stop offset="1" stop-color="#241042"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="80" x2="950" y2="285" gradientUnits="userSpaceOnUse">
