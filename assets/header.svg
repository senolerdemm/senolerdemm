    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(194 90) rotate(35) scale(360 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19C3FF" stop-opacity="0.24"/>
